# go-binfmt documentation — Hugo + Hextra, built like go-coff/docs and
# go-zpkg/docs.
#
# Each documentation version is a separate build under
# https://go-binfmt.github.io/docs/<version>/, where <version> is the minor
# version of the code the pages describe, or "main" while no release is tagged.
# The CI sets it through --baseURL, from params.docs.version below; this default
# is the same build.
baseURL: "https://go-binfmt.github.io/docs/0.8/"
title: "go-binfmt"
# ⛔ No languageCode: deprecated in Hugo 0.158 in favour of locale, and the
# languages block below already says which language this is.

# themes/hextra is the tannevaled/hextra fork, pinned at a release tag as a
# submodule (v0.24.1): upstream Hextra plus opt-in features (partial menu
# items, combos, related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the foot of each one.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
        block: true
  highlight:
    noClasses: false

# ⛔ The content is NOT under content/en/docs. This site is served AT /docs/,
# so a "docs" section would make every page /docs/docs/… . Hextra picks its
# documentation layout from the section being called "docs", so with the
# content at the root the type is cascaded instead.
# ⛔ "target", not "_target": the underscored spelling is deprecated, and the
# build runs with --panicOnWarning.
cascade:
  - target:
      path: "/**"
    params:
      type: docs

params:
  docs:
    # The newest release of any tool the pages describe (elfpatch, fwimg):
    # v0.6.0 is /docs/0.6/, and /docs/latest/ follows the newest. Bump it in
    # the same PR that documents a new minor (see README, "Versions").
    version: "v0.8.0"
  description: "Pure-Go tooling for binary formats, ELF first: elfpatch edits an executable's interpreter, RUNPATH/RPATH and DT_NEEDED in place, with no C toolchain."
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: normal
  editURL:
    enable: true
    base: "https://github.com/go-binfmt/docs/edit/main/content/en"
